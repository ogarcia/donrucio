name: Container

on:
  push:
    branches: [master]
    # Bare semver tags: 0.1.0, 1.2.3-rc1 (no "v" prefix)
    tags: ["[0-9]*"]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  pull_request:
    paths:
      - "Containerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/container.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ALPINE_VERSION: "3.24"

permissions:
  contents: read

jobs:
  # ── Compile the binary once per arch (native runners), cache in GHA ──────────
  build:
    name: Compile binary (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    # aarch64 musl is a cross build from the arm runner's gnu host; point ring's
    # C compiler and the linker at musl-gcc. Target-scoped, so inert for x86_64.
    env:
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev
      - name: Build (static musl)
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir -p dist/${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/donrucio dist/${{ matrix.arch }}/
          strip dist/${{ matrix.arch }}/donrucio
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.arch }}
          path: dist/
          retention-days: 1

  # ── Build the multi-arch image from the prebuilt binaries, cache in GHA ──────
  image:
    name: Build and push image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true
      # QEMU only runs the runtime stage's apk/adduser for the non-native arch
      # (a few seconds); the binary is already compiled, nothing heavy emulated.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          target: runtime
          build-args: |
            BUILDER=prebuilt
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
