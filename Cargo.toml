[package]
name = "donrucio"
version = "0.1.0"
edition = "2021"
description = "Lightweight Telegram help bot for Rucio, answering from the live docs via Groq"
license = "GPL-3.0-or-later"

[dependencies]
ureq = { version = "3.5", features = ["json"] }
serde_json = "1"
anyhow = "1"
dotenvy = "0.15"
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
